name: Integration Test

on: pull_request

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Pin curl_cffi: 0.16.3 chrome136 dropped Priority, which breaks
          # test/pytest/testdata/ech_alps.txt JA4H (14 headers vs 13).
          pip install pytest 'curl_cffi==0.16.2'

      - name: Generate self-signed cert
        run: |
          mkdir -p nginx_utils
          mkdir -p nginx_utils/logs
          openssl req -x509 -nodes -newkey rsa:2048 \
            -keyout nginx_utils/server.key \
            -out nginx_utils/server.crt \
            -days 1 \
            -subj "/CN=localhost"

      - name: Start nginx with Docker Compose
        run: docker compose up --build -d

      - name: Run pytest
        run: pytest
