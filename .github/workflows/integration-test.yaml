name: Integration Test

on:
  pull_request:
  # Runs on main fill the Docker layer cache that pull requests read.
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Pin curl_cffi: 0.16.3 chrome136 dropped Priority, which breaks
          # test/pytest/testdata/ech_alps.txt JA4H (14 headers vs 13).
          pip install pytest 'curl_cffi==0.16.2'

      - name: Generate self-signed cert
        run: |
          mkdir -p nginx_utils
          mkdir -p nginx_utils/logs
          openssl req -x509 -nodes -newkey rsa:2048 \
            -keyout nginx_utils/server.key \
            -out nginx_utils/server.crt \
            -days 1 \
            -subj "/CN=localhost"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # mode=max also caches the openssl stage, so later runs only compile
      # nginx and the module.
      - name: Build nginx image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: final
          tags: ja4-nginx:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start nginx with Docker Compose
        run: docker compose up -d

      - name: Run pytest
        run: pytest
