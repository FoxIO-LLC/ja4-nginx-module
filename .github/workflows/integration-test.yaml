name: Integration Test

on:
  pull_request:
  # Runs on main fill the Docker layer cache that pull requests read.
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate self-signed cert
        run: |
          mkdir -p docker/logs
          openssl req -x509 -nodes -newkey rsa:2048 \
            -keyout docker/server.key \
            -out docker/server.crt \
            -days 1 \
            -subj "/CN=localhost"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # mode=max also caches the openssl stage, so later runs only compile
      # nginx and the module.
      - name: Build nginx image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: final
          tags: ja4-nginx:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start nginx with Docker Compose
        working-directory: docker
        run: docker compose up -d

      - name: Smoke test the image
        run: docker/smoke-test.sh
