name: Test::Nginx

on: pull_request

jobs:
  test:
    name: Test::Nginx (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64-asan-bounds
            runner: ubuntu-24.04
            cc: gcc
            cc_sanitize: "-fsanitize=address,bounds -fno-sanitize-recover=bounds"
            ld_sanitize: "-fsanitize=address,bounds"
          - name: arm64-hwasan
            runner: ubuntu-24.04-arm
            cc: clang
            cc_sanitize: "-fsanitize=hwaddress -fPIE"
            ld_sanitize: "-fsanitize=hwaddress -pie -fuse-ld=lld"

    env:
      NGINX_VERSION: "1.31.4"
      CURLU_VERSION: "1.1.1"
      BUILD_DIR: /tmp/build
      CC: ${{ matrix.cc }}
      ASAN_OPTIONS: detect_leaks=0
      HWASAN_OPTIONS: detect_leaks=0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libpcre2-dev \
            libssl-dev \
            zlib1g-dev \
            perl \
            cpanminus \
            wget \
            git \
            patch \
            iproute2 \
            nftables
          sudo cpanm --notest Test::Nginx

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache: false

      - name: Build curlu
        run: |
          set -euo pipefail
          mkdir -p "${BUILD_DIR}"
          cd "${BUILD_DIR}"
          wget -q "https://github.com/lynch1981/curlu/archive/refs/tags/v${CURLU_VERSION}.tar.gz"
          tar -zxf "v${CURLU_VERSION}.tar.gz"
          cd "curlu-${CURLU_VERSION}"
          bash build.sh

      - name: Download nginx
        run: |
          set -euo pipefail
          mkdir -p "${BUILD_DIR}"
          cd "${BUILD_DIR}"
          wget -q "https://nginx.org/download/nginx-${NGINX_VERSION}.tar.gz"
          tar -zxf "nginx-${NGINX_VERSION}.tar.gz"

      - name: Clone no-pool-nginx
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/openresty/no-pool-nginx.git \
            "${BUILD_DIR}/no-pool-nginx"

      - name: Apply patches
        run: |
          set -euo pipefail
          nginx_src="${BUILD_DIR}/nginx-${NGINX_VERSION}"
          no_pool="${BUILD_DIR}/no-pool-nginx/nginx-${NGINX_VERSION}-no_pool.patch"
          if [ ! -f "${no_pool}" ]; then
            echo "::error::no-pool patch not found: ${no_pool}"
            exit 1
          fi
          patch -p1 -d "${nginx_src}" < "${no_pool}"
          patch -p1 -d "${nginx_src}" \
            < "${GITHUB_WORKSPACE}/patches/nginx.patch"
          patch -p1 -d "${nginx_src}" \
            < "${GITHUB_WORKSPACE}/patches/nginx-tcp-save-syn.patch"

      - name: Build nginx with JA4 module (${{ matrix.name }})
        run: |
          set -euo pipefail
          cd "${BUILD_DIR}/nginx-${NGINX_VERSION}"
          # Sanitizer flags go on make, not configure: nginx sizeof probes
          # execute autotest binaries and SIGILL under HWASan.
          ./configure \
            --with-cc="${CC}" \
            --with-debug \
            --with-cc-opt="-O1 -g -fno-omit-frame-pointer" \
            --add-module="${GITHUB_WORKSPACE}" \
            --with-http_ssl_module \
            --with-http_v2_module \
            || { echo "::error::nginx configure failed"; cat objs/autoconf.err; exit 1; }
          sed -i \
            -e "s|^CFLAGS *=|CFLAGS = ${{ matrix.cc_sanitize }} |" \
            -e "s|^LINK *=.*|LINK = ${CC} ${{ matrix.ld_sanitize }}|" \
            objs/Makefile
          grep -E '^(CFLAGS|LINK)[[:space:]]*=' objs/Makefile
          grep -q -- '-fsanitize=' <<<"$(grep '^CFLAGS[[:space:]]*=' objs/Makefile)" \
            || { echo "::error::CFLAGS missing sanitizer flags"; exit 1; }
          make -j"$(nproc)"
          ./objs/nginx -V

      - name: Run Test::Nginx (unprivileged)
        run: |
          set -euo pipefail
          export PATH="${BUILD_DIR}/curlu-${CURLU_VERSION}:${PATH}"
          export TEST_NGINX_BINARY="${BUILD_DIR}/nginx-${NGINX_VERSION}/objs/nginx"
          prove -v $(ls test/*.t | grep -v 'ja4t-variables\.t')

      # Run last: curlu crafts SYN packets using root-only network operations.
      - name: Run JA4T tests (root)
        run: |
          set -euo pipefail
          export PATH="${BUILD_DIR}/curlu-${CURLU_VERSION}:${PATH}"
          sudo -E env \
            PATH="${PATH}" \
            TEST_NGINX_BINARY="${BUILD_DIR}/nginx-${NGINX_VERSION}/objs/nginx" \
            ASAN_OPTIONS="${ASAN_OPTIONS}" \
            HWASAN_OPTIONS="${HWASAN_OPTIONS}" \
            prove -v test/ja4t-variables.t
